const $=s=>document.querySelector(s),screen=$('#screen'),layer=$('#layer');let stage=-1,miss=0,start=0,elapsed=0,tick=null,flags={},best=(()=>{try{return Number(localStorage.getItem('adhell_best')||0)}catch(e){return 0}})();const total=12;let gameMode='normal',hardGateSeen=new Set();

  const notes=[523.25,659.25,783.99,1046.5,783.99,1046.5,1318.51];

  if(!audioOn||stage<0||stage>=total)return;

function showCaptcha(){
 const rounds=[
  {title:'信号機をすべて選んでください',desc:'まずは普通の画像認証です。',test:k=>k==='signal',pool:['signal','car','signal','tree','signal','car','house','signal','tree']},
  {title:'キャベツをすべて選んでください',desc:'レタスが混ざっています。よく似た葉っぱに注意。',test:k=>k==='cabbage',pool:['lettuce','cabbage','lettuce','cabbage','cabbage','lettuce','cabbage','lettuce','cabbage']},
  {title:'野菜ではないものをすべて選んでください',desc:'「野菜を選べ」とは言っていません。',test:k=>k!=='cabbage'&&k!=='lettuce',pool:['cabbage','car','lettuce','tree','cabbage','house','lettuce','signal','cabbage']}
 ];
 const r=rounds[flags.captchaRound||0];
 // Fisher-Yatesで各ラウンドの並びをランダム化
 const order=r.pool.map((kind,i)=>({kind,i}));
 for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
 const correct=order.map((v,i)=>r.test(v.kind)?i:-1).filter(i=>i>=0).sort((a,b)=>a-b).join(',');
 popup(`<div class="pill">ロボット認証 ${flags.captchaRound+1} / 3</div><h2>${r.title}</h2><p class="muted">${r.desc}</p><div class="captcha" id="tiles">${order.map((v,i)=>`<button class="tile" data-i="${i}" aria-label="画像 ${i+1}" aria-pressed="false">${captchaArt(v.kind,v.i+i)}</button>`).join('')}</div><button id="capDone" class="primary wide" style="margin-top:12px">確認</button><p class="tiny" style="text-align:center">画像を選んでから「確認」を押してください。</p>`);
 document.querySelectorAll('.tile').forEach(x=>x.onclick=()=>{x.classList.toggle('sel');x.setAttribute('aria-pressed',String(x.classList.contains('sel')))});
 $('#capDone').onclick=()=>{
  const chosen=[...document.querySelectorAll('.tile.sel')].map(x=>+x.dataset.i).sort((a,b)=>a-b).join(',');
  if(chosen===correct){sfx('next');flags.captchaRound++;if(flags.captchaRound===3)next();else{toast('認証成功！ 追加の確認が必要です');showCaptcha()}}
  else{wrong('画像が一致しません。よく読んで選び直してください');document.querySelectorAll('.tile.sel').forEach(x=>{x.classList.remove('sel');x.setAttribute('aria-pressed','false')})}
 };
}
function virusWarning(){
 const step=flags.virusStep||0;
 // 各場面で違う操作を要求する。正解は押すたびに別の場所に移る。
 if(step===0){
  popup(`<div class="virus-dialog"><div class="virus-head"><span>⚠ セキュリティ警告</span><span class="virus-fiction">ゲーム内の架空広告</span></div><div class="virus-symbol">!</div><h2>危険なファイルを検出しました！</h2><p class="muted">この警告はサイトが表示したものです。</p><div class="virus-counter">検出された脅威：999件（自称）</div><button id="virusTrap" class="danger wide">今すぐ修復する</button><p class="tiny">右上の × でこの広告を閉じられます。</p><button id="virusClose" class="virus-x" aria-label="警告を閉じる">×</button></div>`);
  $('#virusTrap').onclick=()=>wrong('修復ボタンも広告でした');

 }else if(step===1){
  popup(`<div class="virus-dialog"><div class="virus-head"><span>🛡 安全性チェック</span><span class="virus-fiction">ゲーム内の架空広告</span></div><h2>端末の安全性が 1% です</h2><p class="muted">安全のため、次の操作を選択してください。</p><div class="virus-options"><button id="virusScan" class="secondary">🔍 もう一度スキャン</button><button id="virusIgnore" class="secondary">通知を無視して続行</button><button id="virusProtect" class="primary">🛡 保護プランを有効化</button></div><p class="tiny">※ 本物の端末は診断していません。</p></div>`);
  $('#virusScan').onclick=()=>wrong('スキャンしても同じ広告が表示されるだけでした');
  $('#virusProtect').onclick=()=>wrong('保護プランは広告でした');
  $('#virusIgnore').onclick=()=>{sfx('next');flags.virusStep=2;virusWarning()};
 }else{
  popup(`<div class="virus-dialog"><div class="virus-head"><span>↩ ページを離れますか？</span><span class="virus-fiction">ゲーム内の架空広告</span></div><h2>本当にこのページから離れますか？</h2><p class="muted">閉じると「特別な特典」が失われます。</p><div class="virus-counter">特典の内容：未公開</div><div class="virus-options"><button id="virusStay" class="primary">このページに残る</button><button id="virusLeave" class="secondary">特典を諦めて元のページへ</button></div></div>`);
  $('#virusStay').onclick=()=>wrong('サイトに引き止められました');
  $('#virusLeave').onclick=()=>{layer.innerHTML='';next()};
 }
}

function cancelFlow(i){let steps=[['解約をご希望ですか？','会員特典が失われます。本当によろしいですか？','それでも解約する'],['最後のチャンス！','今なら永久に無料……という気持ちで応援します。','特典を諦める'],['解約理由を教えてください','回答は任意と書いてありますが、選択してください。','解約を確定する']];let s=steps[i];popup(`<h2>${s[0]}</h2><p class="muted">${s[1]}</p>${i===2?'<select id="reason" style="width:100%;padding:12px;margin-bottom:12px"><option value="">選択してください</option><option>使っていない</option><option>勝手に登録された</option><option>ファイルが欲しいだけ</option></select>':''}<button id="stay" class="primary wide">${['解約せず続ける','無料のまま続ける','解約をやめる'][i]}</button><button id="leave" class="link wide">${s[2]}</button>`);$('#stay').onclick=()=>wrong('引き止めに引っかかりました');$('#leave').onclick=()=>{if(i===2&&!$('#reason').value){wrong('理由を選んでください');return}if(i===2)next();else cancelFlow(i+1)}}
function showPermissionFlow(){
 if(stage!==10)return;
 const step=flags.permissionStep||0;
 if(step>=4){
  layer.innerHTML='';
  base('設定完了','ダウンロードの準備に戻ります。',`<div class="panel" style="text-align:center"><h2>すべての設定が完了しました</h2><p class="muted">ダウンロードには、どの権限も必要ありませんでした。</p><button id="permissionsDone" class="primary wide">ダウンロードへ戻る</button></div>`);
  $('#permissionsDone').onclick=next;
  return;
 }
 // 背景は毎回同じページのまま。実際のOSの許可ダイアログを模した架空の画面を上に重ねる。
 if(step===0){
  base('ファイルを準備しています','準備中…',`<div class="panel"><div class="row between"><b>共有ファイル.zip</b><span class="pill">準備中</span></div><p class="muted">ファイルのダウンロードまであと少しです。</p><div class="progress"><div style="width:87%"></div></div></div>`);
 }
 const prompts=[
  {icon:'★',heading:'アプリを評価',sub:'まだ使っていませんか？',body:'使い心地はいかがでしたか？',kind:'review'},
  {icon:'🔔',heading:'通知を許可',sub:'totally-normal.example',body:'「totally-normal.example」が通知の送信を求めています。',kind:'notice'},
  {icon:'📷',heading:'カメラへのアクセス',sub:'totally-normal.example',body:'「totally-normal.example」がカメラの使用を求めています。',kind:'camera'},
  {icon:'📍',heading:'位置情報の使用',sub:'totally-normal.example',body:'「totally-normal.example」が位置情報の使用を求めています。',kind:'location'}
 ];
 const p=prompts[step];
 const baseClose=()=>{flags.permissionStep++;layer.innerHTML='';showPermissionFlow()};
 const permissionReaction=(kind)=>{
  const reactions={
   notice:{icon:'🔔',title:'通知を有効にしました',body:'さっそく通知です。',extra:'「通知を有効にしていただきありがとうございます」という通知が届きました。',action:'通知を閉じる'},
   camera:{icon:'📷',title:'カメラを起動しました',body:'撮影するものがありません。',extra:'ダウンロードするファイルは、カメラでは撮れません。',action:'カメラを閉じる'},
   location:{icon:'📍',title:'位置情報を確認しました',body:'現在地：ダウンロード画面',extra:'目的地：ダウンロード完了まであと少し。',action:'地図を閉じる'},
   review:{icon:'⭐',title:'レビューを受け付けました',body:'評価ありがとうございます。',extra:'まだダウンロードは始まっていません。',action:'閉じる'}
  };
  const r=reactions[kind];
  layer.innerHTML=`<div class="permission-dim"><div class="permission-scene"><div class="permission-native permission-reaction"><div class="permission-native-icon">${r.icon}</div><h2>${r.title}</h2><p>${r.body}</p><div class="permission-reaction-extra">${r.extra}</div><button class="permission-reaction-close" id="permissionReactionClose">${r.action}</button></div><span class="permission-disclaimer">ゲーム内の架空の演出です。実際の権限は使用しません。</span></div></div>`;
  $('#permissionReactionClose').onclick=baseClose;
 };
 const card=step===0
  ? `<div class="permission-native permission-review"><div class="permission-appicon">📁</div><div class="permission-small">ただダウンロードしたいだけなのに。</div><h2>このアプリを評価する</h2><p>ご利用ありがとうございます！</p><div class="permission-stars" id="permissionStars"><button data-star="1">★</button><button data-star="2">★</button><button data-star="3">★</button><button data-star="4">★</button><button data-star="5">★</button></div><button id="permissionLater" class="permission-link">あとで</button><button id="permissionNever" class="permission-link">今はしない</button></div>`
  : `<div class="permission-native ${step===1?'permission-notice':step===2?'permission-camera':'permission-location'}"><div class="permission-native-icon">${p.icon}</div><h2>${p.body}</h2><p class="permission-small">ダウンロードの準備に必要な設定です。</p><div class="permission-native-actions"><button id="permissionNo">${step===3?'許可しない':'許可しない'}</button><button id="permissionYes">${step===3?'今回のみ許可':'許可する'}</button></div></div>`;
 layer.innerHTML=`<div class="permission-dim" id="permissionDim"><div class="permission-scene">${card}<span class="permission-disclaimer">ゲーム内の架空の画面です。実際の権限は要求しません。</span></div></div>`;
 if(step===0){
  document.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{
   const n=+b.dataset.star;
   document.querySelectorAll('[data-star]').forEach(x=>x.classList.toggle('picked',+x.dataset.star<=n));
   setTimeout(()=>{if(stage===10&&flags.permissionStep===step)permissionReaction('review')},300);
  });
  $('#permissionLater').onclick=baseClose;
  $('#permissionNever').onclick=baseClose;
 }else{
  $('#permissionNo').onclick=baseClose;
  $('#permissionYes').onclick=()=>wrong('このダウンロードに権限は必要ありません。許可しないを選んでください');
 }
}
function finalSequence(){
 // 最後のひと押しで、これまでの広告が一瞬だけ復活する。再度閉じる作業はさせない。
 sfx('wrong');
 layer.innerHTML='';
 screen.innerHTML=`<div class="site end"><h1>ダウンロードを開始しています…</h1><p class="muted">最後の確認を行っています。</p><div class="panel"><div class="progress"><div id="lastProgress" style="width:0%"></div></div><p id="lastStatus" class="muted">0%</p></div></div>`;
 let n=0;
 const timer=setInterval(()=>{
   if(stage!==11){clearInterval(timer);return}
   n=Math.min(99,n+17);
   const bar=$('#lastProgress'),label=$('#lastStatus');
   if(bar)bar.style.width=n+'%';
   if(label)label.textContent=n+'%';
   if(n>=99){
     clearInterval(timer);
     setTimeout(()=>{
       if(stage!==11)return;
       screen.innerHTML=`<div class="site end"><div style="font-size:54px">📢</div><h1>お知らせがあります</h1><p class="muted">今まで閉じた広告が、最後にもう一度だけ登場します。</p><div class="final-burst"><span>🎉 今だけ無料！</span><span>スポンサー</span><span>あなたにおすすめ</span><span>広告を閉じましたか？</span><span>DOWNLOAD NOW!</span></div><p class="tiny">安心してください。今回は自動で消えます。</p><button id="endNow" class="primary wide">結果を見る</button></div>`;
       $('#endNow').onclick=finish;
     },450);
   }
 },105);
}
function resultScore(ms, mistakes){
 // 2分以内なら時間満点。以後10秒ごとに1点減点、ミス1回につき3点減点。
 const seconds=ms/1000;
 const timePenalty=Math.max(0,Math.ceil((seconds-(gameMode==='hard'?90:120))/(gameMode==='hard'?8:10)));
 const score=Math.max(0,Math.min(100,100-timePenalty-mistakes*(gameMode==='hard'?5:3)));
 const rank=score>=95?'S':score>=80?'A':score>=60?'B':score>=40?'C':'D';
 return {score,rank};
}
function finish(){const {score,rank}=resultScore(Date.now()-start,miss);sfx('win');clearInterval(tick);elapsed=Date.now()-start;update();if(!devMode&&(!best||elapsed<best)){best=elapsed;(()=>{try{localStorage.setItem(modeBestKey(),String(best))}catch(e){}})()}$('#fill').style.width='100%';layer.innerHTML='';screen.innerHTML=`<div class="site end"><div style="font-size:65px">🏆</div><h1>ダウンロード完了！</h1><p class="muted">長い手続きを突破して、ついにファイルを受け取りました。</p><div class="panel" style="text-align:left"><div class="row between"><b>📄 ダウンロード完了のお知らせ.txt</b><span class="tiny">1 KB</span></div><p style="margin-bottom:4px">「ダウンロードが完了しました。」</p><p class="tiny">※ 目的の共有ファイル.zip は含まれていません。</p></div><p class="muted">ファイルを受け取るために、ファイルを受け取ったというお知らせを受け取りました。</p><div class="panel"><div class="muted">サイトからの評価</div><p><b>${miss===0?"広告を一度も押していただけませんでした。":miss<5?"広告への関心を確認しました。":"広告を大変気に入っていただけたようです。"}</b></p><p class="tiny">${miss===0?"広告主一同、残念に思っています。":`誤クリック ${miss} 回を「興味あり」として集計しました。`}</p></div><div class="panel"><div class="muted">総合スコア</div><div style="font-size:48px;font-weight:900;font-variant-numeric:tabular-nums">${score}<span style="font-size:20px"> / 100点</span></div><div class="pill">ランク ${rank}</div><p class="tiny">${gameMode==='hard'?'90秒以内なら時間減点なし。以降8秒ごとに−1点、誤クリック1回につき−5点。':'2分以内なら時間減点なし。以降10秒ごとに−1点、誤クリック1回につき−3点。'}</p></div><div class="panel"><div class="muted">クリアタイム</div><div style="font-size:42px;font-weight:900;font-variant-numeric:tabular-nums">${timefmt(elapsed)}</div><p>誤クリック：<b>${miss}回</b></p><div class="pill">自己ベスト ${timefmt(best)}</div></div><button id="again" class="primary wide">もう一度プレイ</button><button id="copy" class="secondary wide" style="margin-top:10px">結果をコピー</button><p class="tiny">※ ファイルは架空のため、実際のダウンロードはありません。</p></div>`;$('#again').onclick=()=>{hardGateSeen.clear();devMode=false;stage=-1;miss=0;start=0;elapsed=0;flags={};update();render()};$('#copy').onclick=()=>{let t=`ただダウンロードしたいだけなのに。 ${gameMode==='hard'?'アフィリエイトサイト広告モード':'ノーマルモード'} クリア！\nタイム：${timefmt(elapsed)}\n誤クリック：${miss}回\n総合スコア：${score}点 / 100点（ランク ${rank}）`;copyResult(t)}}

// 開発用メニュー。0401はローカルHTML内の簡易ロックであり、セキュリティ機能ではありません。
function copyResult(t){
 if(navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(t).then(()=>toast('結果をコピーしました')).catch(()=>fallbackCopy(t));
 }else fallbackCopy(t);
}
function fallbackCopy(t){
 const field=document.createElement('textarea');field.value=t;field.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(field);field.focus();field.select();
 let copied=false;try{copied=document.execCommand('copy')}catch(e){}field.remove();
 toast(copied?'結果をコピーしました':t.replaceAll('\n',' / '));
}
function modeBestKey(){return gameMode==='hard'?'adhell_affiliate_best':'adhell_best'}
function getModeBest(mode){try{return Number(localStorage.getItem(mode==='hard'?'adhell_affiliate_best':'adhell_best')||0)}catch(e){return 0}}
function beginMode(mode){
 if(tick)clearInterval(tick);
 if(flags.adInterval)clearInterval(flags.adInterval);
 gameMode=mode;hardGateSeen.clear();devMode=false;stage=-1;flags={};miss=0;elapsed=0;best=getModeBest(mode);
 if(audioOn){try{if(AudioContextClass){audioCtx=audioCtx||new AudioContextClass();audioCtx.resume();startMusic()}}catch(e){}}
 start=Date.now();tick=setInterval(update,100);next();
}
let devUnlocked=false,devMode=false;
const devOverlay=$('#devOverlay'),devBox=$('#devBox');
function closeDev(){devOverlay.classList.remove('open')}
function openDev(){
 devOverlay.classList.add('open');
 if(!devUnlocked){
  devBox.innerHTML=`<div class="dev-head"><h2>⚙ 開発者メニュー</h2><button id="devClose" class="secondary">閉じる</button></div><p class="dev-note">テスト用のステージ移動機能です。</p><input id="devPassword" type="password" inputmode="numeric" autocomplete="off" placeholder="パスワード"><button id="devLogin" class="primary wide">ログイン</button><p id="devError" style="color:#dc2626;font-size:13px"></p>`;
  $('#devClose').onclick=closeDev;
  $('#devLogin').onclick=()=>{
   if($('#devPassword').value==='0401'){devUnlocked=true;openDev()}
   else $('#devError').textContent='パスワードが違います';
  };
  $('#devPassword').onkeydown=e=>{if(e.key==='Enter')$('#devLogin').click()};
  $('#devPassword').focus();
  return;
 }
 devBox.innerHTML=`<div class="dev-head"><h2>⚙ 開発者メニュー</h2><button id="devClose" class="secondary">閉じる</button></div><p class="dev-note">好きな問題からテストできます。開発者モード中の記録は自己ベストに保存しません。</p><div class="dev-grid" id="devStages"></div><button id="devTitle" class="secondary wide">タイトル画面へ戻る</button>`;
 $('#devClose').onclick=closeDev;
 stages.forEach((name,i)=>{
  const b=btn(`${String(i+1).padStart(2,'0')}. ${name}`,()=>jumpToStage(i),'secondary');
  $('#devStages').appendChild(b);
 });
 $('#devTitle').onclick=()=>jumpToStage(-1);
}
function jumpToStage(index){
 // タイマーや動画広告の旧インターバルを残さず、指定ステージを最初から表示。
 if(flags.adInterval)clearInterval(flags.adInterval);
 if(tick)clearInterval(tick);
 $('#toast').innerHTML='';
 layer.innerHTML='';
 closeDev();
 stage=index;
 flags={};
 miss=0;
 elapsed=0;
 start=index<0?0:Date.now();
 devMode=index>=0;
 if(index>=0){
  tick=setInterval(update,100);
  if(audioOn)startMusic();
 }
 update();
 render();
}
$('#devToggle').onclick=openDev;
devOverlay.addEventListener('click',e=>{if(e.target===devOverlay)closeDev()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&devOverlay.classList.contains('open'))closeDev()});

update();render();
</script></body></html>
